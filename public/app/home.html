<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CostLyf – Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo"><img src="/media/iconlogo.png" alt="" class="sidebar-logo-icon"><img src="/media/logo.svg" alt="CostLyf"></a>
      </div>
      <nav class="sidebar-nav">
        <p class="sidebar-nav-heading">Main menu</p>
        <a href="/home" class="sidebar-nav-item sidebar-nav-item--active">
          <span class="sidebar-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span>Home</span>
        </a>
        <a href="/join" class="sidebar-nav-item">
          <span class="sidebar-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
          <span>Join</span>
        </a>
        <a href="/share" class="sidebar-nav-item">
          <span class="sidebar-nav-icon sidebar-nav-icon--circle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
          <span>Share</span>
        </a>
        <a href="/inbox" class="sidebar-nav-item">
          <span class="sidebar-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
          <span>Inbox</span>
          <span class="inbox-unread-badge" hidden aria-label="Unread messages"></span>
        </a>
        <a href="/wallet" class="sidebar-nav-item">
          <span class="sidebar-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="15" r="1.5" fill="currentColor"/></svg></span>
          <span>Wallet</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/profile" class="sidebar-user" aria-label="Profile">
          <span class="sidebar-user-avatar" id="sidebar-nav-avatar" aria-hidden="true"></span>
          <span class="sidebar-user-label">Profile</span>
        </a>
      </div>
    </aside>

    <div class="dashboard-content">
      <main class="dashboard-main">
        <section class="dashboard-home">
          <a href="/wallet" class="home-balance">
            <span class="home-balance-label">Balance</span>
            <span class="home-balance-right">
              <span class="home-balance-amount">0€</span>
              <span class="home-balance-chevron" aria-hidden="true">›</span>
            </span>
          </a>

          <!-- My offers (populated by JS from localStorage) -->
          <section class="my-offers" id="my-offers-section">
            <h2 class="my-offers-title">My offers</h2>
            <div class="my-offers-list" id="my-offers-list">
              <div class="skeleton-cards">
                <div class="skeleton-card"><span class="skeleton-card__avatar"></span><div class="skeleton-card__lines"><span class="skeleton-card__line skeleton-card__line--name"></span><span class="skeleton-card__line skeleton-card__line--sub"></span></div><span class="skeleton-card__chevron"></span></div>
                <div class="skeleton-card"><span class="skeleton-card__avatar"></span><div class="skeleton-card__lines"><span class="skeleton-card__line skeleton-card__line--name"></span><span class="skeleton-card__line skeleton-card__line--sub"></span></div><span class="skeleton-card__chevron"></span></div>
                <div class="skeleton-card"><span class="skeleton-card__avatar"></span><div class="skeleton-card__lines"><span class="skeleton-card__line skeleton-card__line--name"></span><span class="skeleton-card__line skeleton-card__line--sub"></span></div><span class="skeleton-card__chevron"></span></div>
              </div>
            </div>
          </section>

          <!-- My subscriptions (same style as My offers) -->
          <section class="my-offers my-subscriptions" id="my-subscriptions-section">
            <h2 class="my-offers-title">My subscriptions</h2>
            <div class="my-offers-list" id="my-subscriptions-list">
              <div class="skeleton-cards">
                <div class="skeleton-card"><span class="skeleton-card__avatar"></span><div class="skeleton-card__lines"><span class="skeleton-card__line skeleton-card__line--name"></span><span class="skeleton-card__line skeleton-card__line--sub"></span></div><span class="skeleton-card__chevron"></span></div>
                <div class="skeleton-card"><span class="skeleton-card__avatar"></span><div class="skeleton-card__lines"><span class="skeleton-card__line skeleton-card__line--name"></span><span class="skeleton-card__line skeleton-card__line--sub"></span></div><span class="skeleton-card__chevron"></span></div>
                <div class="skeleton-card"><span class="skeleton-card__avatar"></span><div class="skeleton-card__lines"><span class="skeleton-card__line skeleton-card__line--name"></span><span class="skeleton-card__line skeleton-card__line--sub"></span></div><span class="skeleton-card__chevron"></span></div>
              </div>
            </div>
          </section>

          <div class="home-cards">
            <!-- Left: Join a Subscription -->
            <div class="home-card home-card--join">
              <div class="home-card-inner">
                <h2 class="home-card-title"><span class="home-card-title-accent">Join a</span> Subscription</h2>
                <div class="home-card-illus">
                  <img src="/media/home/chairs.png" alt="" class="home-card-illus-img">
                </div>
                <a href="/join" class="home-pill">
                  <svg class="home-pill-icon home-pill-icon--svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  <span class="home-pill-text">Join</span>
                </a>
              </div>
            </div>

            <!-- Right: Share a Subscription -->
            <div class="home-card home-card--share">
              <div class="home-card-inner">
                <h2 class="home-card-title"><span class="home-card-title-accent">Share a</span> Subscription</h2>
                <div class="home-card-illus">
                  <img src="/media/home/openhouse.png" alt="" class="home-card-illus-img">
                </div>
                <a href="/share" class="home-pill">
                  <svg class="home-pill-icon home-pill-icon--svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                  <span class="home-pill-text">Share</span>
                </a>
              </div>
            </div>
          </div>

          <!-- Bottom: Control mode -->
          <div class="home-card home-card--control">
            <div class="home-card-inner home-card-inner--wide">
              <div class="home-control-text">
                <h2 class="home-card-title home-card-title--left">Control mode</h2>
                <p class="home-card-subtitle">Zero fees. Automatic splits. Full control.</p>
                <a href="/home#costlyf-one" class="home-pill home-pill--no-icon">
                  <span class="home-pill-text">Discover Costlyf One</span>
                </a>
              </div>
              <div class="home-control-illus">
                <img src="/media/home/on.png" alt="" class="home-card-illus-img">
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="/home" class="bottom-nav-item bottom-nav-item--active">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a href="/join" class="bottom-nav-item">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <span>Join</span>
      </a>
      <a href="/share" class="bottom-nav-item">
        <span class="bottom-nav-icon bottom-nav-icon--circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span>Share</span>
      </a>
      <a href="/inbox" class="bottom-nav-item">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span>Inbox</span>
        <span class="inbox-unread-badge" hidden aria-label="Unread messages"></span>
      </a>
      <a href="/profile" class="bottom-nav-item">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </nav>
  </div>
  <script src="/app/dashboard.js"></script>
  <script src="/app/home.js"></script>
  <script src="/app/inbox-badge.js"></script>
</body>
</html>
