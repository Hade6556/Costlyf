<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CostLyf – Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/dashboard.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
    .auth-card { width: 100%; max-width: 400px; padding: 2rem; background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .auth-logo { display: block; margin-bottom: 1.5rem; }
    .auth-title { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--dash-text); }
    .auth-subtitle { margin: 0 0 1.5rem; font-size: 0.9375rem; color: var(--dash-text-muted); }
    .auth-form .field { margin-bottom: 1rem; }
    .auth-form .field-row { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
    .auth-form .field-row .field { flex: 1; min-width: 0; margin-bottom: 0; }
    .auth-form label { display: block; margin-bottom: 0.35rem; font-size: 0.875rem; font-weight: 500; color: var(--dash-text); }
    .auth-form input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e0e0e0; border-radius: 12px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
    .auth-form input:focus { outline: none; border-color: var(--dash-primary); }
    .auth-submit { width: 100%; margin-top: 0.5rem; padding: 0.875rem; border: none; border-radius: 12px; background: var(--dash-primary); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .auth-submit:hover { background: #1d1d1f; }
    .auth-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-error { margin-top: 1rem; padding: 0.75rem; background: #fef2f2; color: #b91c1c; font-size: 0.875rem; border-radius: 8px; display: none; }
    .auth-error.visible { display: block; }
    .auth-footer { margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--dash-text-muted); }
    .auth-footer a { color: var(--dash-primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="auth-logo"><img src="/media/logo.svg" alt="CostLyf" width="120"></a>
      <h1 class="auth-title">Sign up</h1>
      <p class="auth-subtitle">Create your CostLyf account.</p>
      <form class="auth-form" id="signup-form" novalidate>
        <div class="field">
          <label for="signup-email">E-mail</label>
          <input type="email" id="signup-email" name="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" required placeholder="••••••••" autocomplete="new-password" minlength="6">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="signup-first-name">First name</label>
            <input type="text" id="signup-first-name" name="first_name" placeholder="First name" autocomplete="given-name">
          </div>
          <div class="field">
            <label for="signup-last-name">Last name</label>
            <input type="text" id="signup-last-name" name="last_name" placeholder="Last name" autocomplete="family-name">
          </div>
        </div>
        <div class="field">
          <label for="signup-alias">Alias</label>
          <input type="text" id="signup-alias" name="alias" placeholder="Display name / alias" autocomplete="username">
        </div>
        <div class="field">
          <label for="signup-phone">Phone (optional)</label>
          <input type="tel" id="signup-phone" name="phone" placeholder="+33 6 12 34 56 78" autocomplete="tel">
        </div>
        <div class="field">
          <label for="signup-dob">Date of Birth</label>
          <input type="date" id="signup-dob" name="date_of_birth" autocomplete="bday">
        </div>
        <p class="auth-error" id="signup-error" role="alert"></p>
        <button type="submit" class="auth-submit" id="signup-submit">Create account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
  <script src="/app/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('signup-form');
      var errorEl = document.getElementById('signup-error');
      var submitBtn = document.getElementById('signup-submit');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.classList.remove('visible');
        errorEl.textContent = '';
        var payload = {
          email: document.getElementById('signup-email').value.trim(),
          password: document.getElementById('signup-password').value,
          first_name: document.getElementById('signup-first-name').value.trim() || undefined,
          last_name: document.getElementById('signup-last-name').value.trim() || undefined,
          alias: document.getElementById('signup-alias').value.trim() || undefined,
          phone: document.getElementById('signup-phone').value.trim() || undefined,
          date_of_birth: document.getElementById('signup-dob').value || undefined
        };
        if (!payload.email || !payload.password) {
          errorEl.textContent = 'Email and password are required.';
          errorEl.classList.add('visible');
          return;
        }
        submitBtn.disabled = true;
        fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; }); })
          .then(function (result) {
            if (result.ok && result.data.access_token) {
              Auth.setSession(result.data.access_token, result.data.refresh_token);
              window.location.href = '/home';
            } else if (result.ok) {
              errorEl.textContent = result.data.message || 'Account created. Please log in.';
              errorEl.classList.add('visible');
            } else {
              errorEl.textContent = result.data.error || 'Sign up failed';
              errorEl.classList.add('visible');
            }
          })
          .catch(function () {
            errorEl.textContent = 'Network error. Try again.';
            errorEl.classList.add('visible');
          })
          .finally(function () { submitBtn.disabled = false; });
      });
    })();
  </script>
</body>
</html>
