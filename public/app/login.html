<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CostLyf – Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/dashboard.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
    .auth-card { width: 100%; max-width: 400px; padding: 2rem; background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .auth-logo { display: block; margin-bottom: 1.5rem; }
    .auth-title { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 700; color: var(--dash-text); }
    .auth-subtitle { margin: 0 0 1.5rem; font-size: 0.9375rem; color: var(--dash-text-muted); }
    .auth-form .field { margin-bottom: 1rem; }
    .auth-form label { display: block; margin-bottom: 0.35rem; font-size: 0.875rem; font-weight: 500; color: var(--dash-text); }
    .auth-form input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e0e0e0; border-radius: 12px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
    .auth-form input:focus { outline: none; border-color: var(--dash-primary); }
    .auth-submit { width: 100%; margin-top: 0.5rem; padding: 0.875rem; border: none; border-radius: 12px; background: var(--dash-primary); color: #fff; font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .auth-submit:hover { background: #1d1d1f; }
    .auth-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-error { margin-top: 1rem; padding: 0.75rem; background: #fef2f2; color: #b91c1c; font-size: 0.875rem; border-radius: 8px; display: none; }
    .auth-error.visible { display: block; }
    .auth-footer { margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--dash-text-muted); }
    .auth-footer a { color: var(--dash-primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="auth-logo"><img src="/media/logo.svg" alt="CostLyf" width="120"></a>
      <h1 class="auth-title">Log in</h1>
      <p class="auth-subtitle">Enter your email and password.</p>
      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <p class="auth-error" id="login-error" role="alert"></p>
        <button type="submit" class="auth-submit" id="login-submit">Log in</button>
      </form>
      <p class="auth-footer">Don’t have an account? <a href="/signup">Sign up</a></p>
    </div>
  </div>
  <script src="/app/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var email = document.getElementById('login-email');
      var password = document.getElementById('login-password');
      var errorEl = document.getElementById('login-error');
      var submitBtn = document.getElementById('login-submit');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.classList.remove('visible');
        errorEl.textContent = '';
        submitBtn.disabled = true;
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), password: password.value })
        })
          .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (result) {
            if (result.ok) {
              if (result.data.access_token) {
                Auth.setSession(result.data.access_token, result.data.refresh_token);
                var params = new URLSearchParams(window.location.search);
                var redirect = params.get('redirect');
                if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
                  window.location.href = redirect;
                } else {
                  window.location.href = '/home';
                }
              } else {
                errorEl.textContent = result.data.message || 'Please try logging in.';
                errorEl.classList.add('visible');
              }
            } else {
              errorEl.textContent = result.data.error || 'Login failed';
              errorEl.classList.add('visible');
            }
          })
          .catch(function () {
            errorEl.textContent = 'Network error. Try again.';
            errorEl.classList.add('visible');
          })
          .finally(function () { submitBtn.disabled = false; });
      });
    })();
  </script>
</body>
</html>
